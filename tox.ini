# content of: tox.ini , put in same dir as setup.py
[tox]
envlist = py310, py311, py312, py313, py314, pypy310, pypy311
; envlist = pypy311

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
    pypy-3.10: pypy310
    pypy-3.11: pypy311

[testenv]
# install pytest in the virtualenv where commands will be executed
deps = pytest
commands =
    # NOTE: you can run any command line tool here - not just tests
    pytest
